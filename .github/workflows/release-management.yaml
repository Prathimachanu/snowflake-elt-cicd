name: Release Management

# Automatically creates the sprint "box" (dev_release_<sprint end date>),
# lets you create an emergency release, and deletes old release branches.
# NOTE: scheduled runs only work from the repo's DEFAULT branch (keep it as dev).

on:
  schedule:
    - cron: "0 1 * * *"          # every day at 01:00 UTC
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        type: choice
        options:
          - create-sprint-release
          - create-emergency-release
          - cleanup-old-branches

env:
  SPRINT_ANCHOR_END: "20261023"   # CHANGE ME: any one real sprint END date (YYYYMMDD)
  SPRINT_LENGTH_DAYS: 14          # sprint length
  BRANCH_AGE_DAYS: 90             # release branches older than this get deleted

permissions:
  contents: write

jobs:
  create-sprint-release:
    if: github.event_name == 'schedule' || github.event.inputs.action == 'create-sprint-release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create the release branch for the current sprint
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          # Find the END date of the sprint we are in today
          TODAY=$(date -u +%Y%m%d)
          DIFF=$(( ( $(date -ud "$TODAY" +%s) - $(date -ud "$SPRINT_ANCHOR_END" +%s) ) / 86400 ))
          REM=$(( ( (DIFF % SPRINT_LENGTH_DAYS) + SPRINT_LENGTH_DAYS ) % SPRINT_LENGTH_DAYS ))
          ADD=$(( (SPRINT_LENGTH_DAYS - REM) % SPRINT_LENGTH_DAYS ))
          SPRINT_END=$(date -ud "@$(( $(date -ud "$TODAY" +%s) + ADD * 86400 ))" +%Y%m%d)
          BRANCH="dev_release_${SPRINT_END}"
          echo "Today: $TODAY | current sprint ends: $SPRINT_END | branch: $BRANCH"

          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            echo "Branch $BRANCH already exists - nothing to do"
          else
            git push origin "origin/dev:refs/heads/${BRANCH}"
            echo "SUCCESS: created $BRANCH from dev"
          fi

  create-emergency-release:
    if: github.event.inputs.action == 'create-emergency-release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create emergency release branch (today's date)
        run: |
          BRANCH="dev_release_$(date -u +%Y%m%d)"
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            echo "Branch $BRANCH already exists - using it"
          else
            git push origin "origin/dev:refs/heads/${BRANCH}"
            echo "SUCCESS: created $BRANCH from dev"
          fi

  cleanup-old-branches:
    if: github.event_name == 'schedule' || github.event.inputs.action == 'cleanup-old-branches'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete release branches older than BRANCH_AGE_DAYS
        run: |
          CUTOFF=$(date -u -d "$BRANCH_AGE_DAYS days ago" +%s)
          git for-each-ref --format='%(refname:lstrip=3) %(committerdate:unix)' refs/remotes/origin |
          while read -r BRANCH TS; do
            # only *_release_YYYYMMDD branches; dev, qa, main are never touched
            [[ "$BRANCH" =~ ^(dev|qa|prod)_release_[0-9]{8}$ ]] || continue
            if (( TS < CUTOFF )); then
              git push origin --delete "$BRANCH"
              echo "Deleted old release branch: $BRANCH"
            fi
          done
